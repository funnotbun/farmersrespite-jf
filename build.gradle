plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.12'
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

repositories {
	mavenLocal()

	maven {
		// Farmer's Delight Refabricated
		name = "Greenhouse Maven"
		url = 'https://maven.greenhouse.lgbt/releases/'
	}

	maven { // Fabric ASM
		url = "https://jitpack.io/"
	}

	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven { url "https://maven.ryanliptak.com/" } // AppleSkin
	maven { url = "https://maven.shedaniel.me/" } // Cloth and deps

	maven {
		// JEI (compile-only integration)
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	maven { url 'https://www.cursemaven.com' }
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Fabric
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Farmer's Delight Refabricated — published against base MC (no per-patch artifacts).
	implementation("vectorwing:FarmersDelight:${minecraft_min_version}-${farmersdelight_version}+refabricated") {
		exclude(group: "net.fabricmc")
	}

	// Cloth Config API (replaces the Forge Config API port)
	api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI (optional client integration; never bundled)
	compileOnly("maven.modrinth:jei:${jei_version}")
	localRuntime("maven.modrinth:jei:${jei_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
